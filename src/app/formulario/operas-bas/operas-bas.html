<div class="col-6">
    <div class="mb-3">
        <form action="">
            <div class="form-group pt-4">
                <label for="num1">Numero1:</label>
                <input [(ngModel)]="num1" 
                type="text" name="num1"
                class="form-control"
                id="num1"

                >
            </div>
             <div class="form-group pt-4">
                <label for="num2">Numero2:</label>
                <input [(ngModel)]="num2"
                type="text" name="num1"

                placeholder="Ingresa numero 2"
                >
            </div>
            <br/>
