<div class="col-6">

    <div class="mb-3">
        <label>Figura</label>
      <div class="mb-3">
    <label>Figura:</label>

    <div>
        <input type="radio" name="figura" value="Rectangulo" [(ngModel)]="figura">
        Rectángulo
    </div>

    <div>
        <input type="radio" name="figura" value="Cuadrado" [(ngModel)]="figura">
        Cuadrado
    </div>

    <div>
        <input type="radio" name="figura" value="Triangulo" [(ngModel)]="figura">
        Triángulo
    </div>

    <div>
        <input type="radio" name="figura" value="Circulo" [(ngModel)]="figura">
        Círculo
    </div>

    <div>
        <input type="radio" name="figura" value="Pentagono" [(ngModel)]="figura">
        Pentágono
    </div>
</div>
    </div>

    <div class="mb-3">
        <label>Valor 1</label>
        <input type="text" [(ngModel)]="valor1" class="form-control">
    </div>

    <div class="mb-3">
        <label>Valor 2</label>
        <input type="text" [(ngModel)]="valor2" class="form-control">
    </div>

    <button (click)="calcular()" type="button" class="btn btn-primary">
        Calcular
    </button>

</div>

<div class="col-6">
    <h3>Resultado: {{resultado}}</h3>
</div>
