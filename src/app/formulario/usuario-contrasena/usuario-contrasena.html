<div class="col-6">

    <div class="mb-3">
        <label>Usuario</label>
        <input type="text" [(ngModel)]="usuario" class="form-control">
    </div>

    <div class="mb-3">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="contrasena" class="form-control">
    </div>

    <button (click)="validar()" type="button" class="btn btn-primary">
        Iniciar sesión
    </button>

</div>

<div class="col-6">
    <h3>{{mensaje}}</h3>
</div>
